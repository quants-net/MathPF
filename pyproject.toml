[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "Cython>=3.0", "numpy>=1.21"]
build-backend = "setuptools.build_meta"

[project]
name = "mathpf"
dynamic = ["version"]
description = "Numerically stable special functions and primitives (Mills ratio, normalised moment averages, etc.)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["mpmath>=1.3", "pytest"]                  # for tools/ (coefficient refit) and the test suite

[project.urls]
Homepage = "https://github.com/quants-net/MathPF"

[tool.setuptools_scm]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip  = "*-musllinux*"
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
archs = ["x86_64"]


[tool.cibuildwheel.windows]
archs = ["AMD64"]
